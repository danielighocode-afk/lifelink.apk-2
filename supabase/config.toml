# Only needed if you deploy with the Supabase CLI (the dashboard has the same switch per function).
[functions.paystack-init]
verify_jwt = true
[functions.paystack-verify]
verify_jwt = true
[functions.paystack-webhook]
verify_jwt = false   # Paystack cannot send a Supabase JWT; the HMAC signature protects this endpoint.
[functions.send-push]
verify_jwt = false   # Called by a Database Webhook on new notifications; the x-webhook-secret header protects it.
[functions.send-greetings]
verify_jwt = false   # Called every 5 minutes by pg_cron; the x-webhook-secret header protects it.
[functions.admin-push]
verify_jwt = true    # Called from the admin dashboard; it also checks that the caller is an admin.
