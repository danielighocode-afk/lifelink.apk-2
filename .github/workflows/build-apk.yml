name: Build LifeLink APK
# Run it by hand (Actions -> Build LifeLink APK -> Run workflow) for a test build,
# or push a tag like v1.1.1 to build a SIGNED release and publish it on GitHub Releases.
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - name: Install dependencies
        run: npm install
      - name: Prepare web files
        run: npm run prepare:www
      - name: Create Android project
        run: npx cap add android
      - name: Apply LifeLink Android settings (also sets the version from version.json)
        run: node scripts/android-setup.js
      - name: Sync web files into the app
        run: npx cap sync android
      - name: Build release APK (unsigned)
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleRelease
      - name: Sign with the LifeLink release key
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KS_B64" ]; then echo "Missing ANDROID_KEYSTORE_BASE64 secret. See UPDATES.md."; exit 1; fi
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/lifelink-release.jks"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          UNSIGNED=$(ls android/app/build/outputs/apk/release/*.apk | head -1)
          "$BT/zipalign" -f -p 4 "$UNSIGNED" "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/lifelink-release.jks" --ks-pass env:KS_PASS --ks-key-alias "$KEY_ALIAS" --key-pass env:KEY_PASS --out LifeLink.apk "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" verify --print-certs LifeLink.apk
          rm -f "$RUNNER_TEMP/lifelink-release.jks"
      - uses: actions/upload-artifact@v4
        with:
          name: lifelink-apk
          path: |
            LifeLink.apk
            version.json
      - name: Publish GitHub release (tag builds only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" LifeLink.apk version.json --title "LifeLink ${{ github.ref_name }}" --notes "$(node -p "require('./version.json').notes")"
