<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Profile - LIFELINK</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { theme: { extend: {
  colors: { emerald: { 50:'#ecfdf5', 100:'#d1fae5', 500:'#10b981', 600:'#059669', 700:'#047857' },
            charcoal: { 50:'#f8fafc', 100:'#f1f5f9', 200:'#e2e8f0', 300:'#cbd5e1', 400:'#94a3b8', 500:'#64748b', 600:'#475569', 700:'#334155', 800:'#1e293b', 900:'#0f172a' } },
  fontFamily: { sans: ['Plus Jakarta Sans','sans-serif'] } } } }
  </script>
  <style>
    body { background-color: #F8FAFC; color: #0F172A; font-family: 'Plus Jakarta Sans', sans-serif; }
    #app { padding: 0 !important; max-width: 560px !important; }
    .pf-old { }
    .pf-top { position: relative; padding: calc(16px + env(safe-area-inset-top, 0px)) 18px 78px; color: #fff; background: linear-gradient(145deg, #0a5a42 0%, #0b7a58 50%, #13a174 100%); overflow: hidden; }
    .pf-top::before, .pf-top::after { content: ""; position: absolute; border-radius: 50%; background: rgba(255,255,255,.07); pointer-events: none; }
    .pf-top::before { width: 240px; height: 240px; right: -70px; top: -90px; } .pf-top::after { width: 160px; height: 160px; left: -60px; bottom: -70px; }
    .pf-top.has-ban { background-size: cover; background-position: center; }
    .pf-top.has-ban .pf-sc { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0,0,0,.38) 0%, rgba(0,0,0,.18) 45%, rgba(0,0,0,.5) 100%); pointer-events: none; }
    .pf-top.has-ban::before, .pf-top.has-ban::after { display: none; }
    .pf-bcam { width: 40px; height: 40px; border-radius: 50%; border: 0; background: rgba(255,255,255,.16); color: #fff; display: grid; place-items: center; cursor: pointer; } .pf-bcam svg { width: 20px; height: 20px; }
    .pf-btns { display: flex; gap: 10px; }
    .pf-banprev { width: 100%; aspect-ratio: 16 / 7; border-radius: 16px; overflow: hidden; margin-top: 14px; background: linear-gradient(145deg, #0a5a42, #13a174); } .pf-banprev img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .pf-row1 { position: relative; display: flex; align-items: center; justify-content: space-between; }
    .pf-row1 img { height: 36px; width: auto; background: #fff; border-radius: 12px; padding: 5px 10px; box-sizing: content-box; }
    .pf-gear { width: 40px; height: 40px; border-radius: 50%; border: 0; background: rgba(255,255,255,.16); color: #fff; display: grid; place-items: center; cursor: pointer; } .pf-gear svg { width: 21px; height: 21px; }
    .pf-who { position: relative; display: flex; align-items: center; gap: 16px; margin-top: 20px; }
    .pf-av { position: relative; width: 92px; height: 92px; flex: none; }
    .pf-av .ph { width: 100%; height: 100%; border-radius: 50%; overflow: hidden; border: 3px solid rgba(255,255,255,.9); background: linear-gradient(135deg, #18b785, #0b7a58); color: #fff; display: grid; place-items: center; font-size: 30px; font-weight: 800; box-sizing: border-box; }
    .pf-av .ph img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .pf-cam { position: absolute; right: -2px; bottom: -2px; width: 32px; height: 32px; border-radius: 50%; border: 2px solid #fff; background: #0b7a58; color: #fff; display: grid; place-items: center; cursor: pointer; padding: 0; } .pf-cam svg { width: 15px; height: 15px; }
    .pf-name { margin: 0; font-size: 21px; font-weight: 800; line-height: 1.2; word-break: break-word; }
    .pf-tag { margin: 5px 0 0; font-size: 13.5px; opacity: .92; font-weight: 600; } .pf-loc { margin: 4px 0 0; display: flex; gap: 5px; align-items: center; font-size: 13px; font-weight: 600; opacity: .92; } .pf-loc svg { width: 14px; height: 14px; }
    .pf-edit { margin-top: 12px; display: inline-flex; align-items: center; gap: 7px; border: 1.5px solid rgba(255,255,255,.7); background: rgba(255,255,255,.1); color: #fff; font: inherit; font-size: 13.5px; font-weight: 800; padding: 8px 15px; border-radius: 12px; cursor: pointer; } .pf-edit svg { width: 15px; height: 15px; }
    .pf-body { position: relative; margin-top: -54px; padding: 0 16px 24px; }
    .pf-card { background: var(--ll-surface, #fff); border: 1px solid var(--ll-border, #dfe7e3); border-radius: 22px; box-shadow: 0 10px 28px rgba(15,23,42,.08); }
    .pf-wal { display: grid; grid-template-columns: 1.3fr 1fr; padding: 16px 4px 16px 16px; align-items: center; gap: 8px; }
    .pf-wal small { display: block; font-size: 12.5px; color: var(--ll-text-2, #64748b); font-weight: 600; } .pf-wal b { display: block; font-size: 24px; font-weight: 800; color: var(--ll-text); margin-top: 2px; }
    .pf-add { display: inline-flex; align-items: center; gap: 6px; margin-top: 10px; border: 0; background: var(--ll-primary, #07865f); color: #fff; font: inherit; font-size: 13px; font-weight: 800; padding: 9px 14px; border-radius: 11px; cursor: pointer; }
    .pf-bk { border: 0; background: none; text-align: left; font: inherit; color: inherit; cursor: pointer; padding: 0 14px 0 18px; border-left: 1px solid var(--ll-border, #dfe7e3); display: flex; align-items: center; justify-content: space-between; gap: 6px; } .pf-bk svg { width: 18px; height: 18px; color: var(--ll-text-2, #64748b); }
    .pf-h { margin: 22px 2px 10px; font-size: 17px; font-weight: 800; color: var(--ll-text); }
    .pf-qa { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    .pf-qa button { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 14px 4px; border-radius: 18px; border: 1px solid var(--ll-border, #dfe7e3); background: var(--ll-surface, #fff); color: var(--ll-text); font: inherit; font-size: 12.5px; font-weight: 700; text-align: center; cursor: pointer; transition: transform .15s; animation: pfIn .4s cubic-bezier(.2,.8,.2,1) both; } .pf-qa button:active { transform: scale(.96); }
    .pf-ic { display: grid; place-items: center; width: 42px; height: 42px; border-radius: 50%; background: rgba(7,134,95,.12); color: var(--ll-primary, #07865f); flex: none; } .pf-ic svg { width: 20px; height: 20px; }
    .pf-list { background: var(--ll-surface, #fff); border: 1px solid var(--ll-border, #dfe7e3); border-radius: 20px; overflow: hidden; }
    .pf-li { display: flex; align-items: center; gap: 12px; width: 100%; box-sizing: border-box; padding: 13px 14px; border: 0; background: none; font: inherit; color: var(--ll-text); text-align: left; cursor: pointer; text-decoration: none; }
    .pf-li + .pf-li { border-top: 1px solid var(--ll-border, #e5ece8); } .pf-li:active { background: var(--ll-surface-2, #eef3f0); }
    .pf-li div { flex: 1; min-width: 0; } .pf-li b { display: block; font-size: 14.5px; font-weight: 700; } .pf-li small { display: block; margin-top: 2px; font-size: 12.5px; color: var(--ll-text-2, #64748b); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .pf-li > svg { width: 17px; height: 17px; color: var(--ll-text-2, #94a3b8); flex: none; }
    .pf-li.danger { color: #e11d48; } .pf-li.danger .pf-ic { background: rgba(225,29,72,.1); color: #e11d48; }
    .pf-sub { padding-bottom: 110px; }
    .pf-bar { display: flex; align-items: center; gap: 8px; padding: calc(10px + env(safe-area-inset-top, 0px)) 12px 8px; }
    .pf-bar h1 { flex: 1; margin: 0; font-size: 18px; font-weight: 800; color: var(--ll-text); }
    .pf-back { width: 40px; height: 40px; border-radius: 50%; border: 0; background: transparent; color: var(--ll-text); display: grid; place-items: center; cursor: pointer; } .pf-back svg { width: 22px; height: 22px; }
    .pf-save { border: 0; background: var(--ll-primary, #07865f); color: #fff; font: inherit; font-size: 14px; font-weight: 800; padding: 9px 18px; border-radius: 12px; cursor: pointer; }
    .pf-pad { padding: 4px 18px 0; }
    .pf-big { position: relative; width: 112px; height: 112px; margin: 6px auto 4px; } .pf-big .ph { width: 100%; height: 100%; border-radius: 50%; overflow: hidden; background: linear-gradient(135deg, #18b785, #0b7a58); color: #fff; display: grid; place-items: center; font-size: 36px; font-weight: 800; } .pf-big .ph img { width: 100%; height: 100%; object-fit: cover; }
    .pf-big .pf-cam { width: 36px; height: 36px; right: 0; bottom: 0; } .pf-big .pf-cam svg { width: 17px; height: 17px; }
    .pf-cap { text-align: center; margin: 6px 0 0; font-size: 14px; font-weight: 800; color: var(--ll-primary, #07865f); } .pf-cap2 { text-align: center; margin: 2px 0 14px; font-size: 12px; color: var(--ll-text-2, #64748b); font-weight: 600; }
    .pf-l { display: block; margin: 16px 0 7px; font-size: 13.5px; font-weight: 800; color: var(--ll-text); } .pf-l small { font-weight: 600; color: var(--ll-text-2, #64748b); }
    .pf-in { width: 100%; box-sizing: border-box; background: var(--ll-surface, #fff); color: var(--ll-text); border: 1px solid var(--ll-border, #dfe7e3); border-radius: 14px; padding: 13px 14px; font: inherit; font-size: 15px; font-weight: 600; outline: none; }
    .pf-in:focus { border-color: var(--ll-primary, #07865f); box-shadow: 0 0 0 3px rgba(7,134,95,.15); } .pf-in[readonly] { opacity: .75; } textarea.pf-in { resize: none; min-height: 100px; line-height: 1.5; font-weight: 500; }
    .pf-hint { margin: 6px 2px 0; font-size: 12px; color: var(--ll-text-2, #64748b); font-weight: 600; }
    .pf-foot { position: fixed; left: 16px; right: 16px; z-index: 40; bottom: calc(var(--ll-tab-h, 64px) + env(safe-area-inset-bottom, 0px) + 12px); max-width: 528px; margin: 0 auto; }
    body:not(.ll-has-tabbar) .pf-foot { bottom: calc(env(safe-area-inset-bottom, 0px) + 16px); }
    .pf-go { display: block; width: 100%; border: 0; background: var(--ll-primary, #07865f); color: #fff; font: inherit; font-size: 16px; font-weight: 800; padding: 16px; border-radius: 16px; cursor: pointer; box-shadow: 0 8px 22px rgba(7,134,95,.3); } .pf-go:disabled { opacity: .6; }
    .pf-tip { margin-top: 14px; padding: 14px 16px; border-radius: 18px; background: rgba(7,134,95,.09); font-size: 13px; line-height: 1.7; font-weight: 600; color: var(--ll-text); } .pf-tip b { display: block; margin-bottom: 2px; font-size: 14.5px; }
    .pf-th { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; } .pf-th button { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 18px 6px; border-radius: 18px; border: 2px solid var(--ll-border, #dfe7e3); background: var(--ll-surface, #fff); color: var(--ll-text); font: inherit; font-size: 13.5px; font-weight: 700; cursor: pointer; } .pf-th button.on { border-color: var(--ll-primary, #07865f); background: rgba(7,134,95,.09); } .pf-th svg { width: 22px; height: 22px; }
    .pf-fs button { padding: 14px 6px; } .pf-fs span { font-weight: 800; }
    .pf-sheet { position: fixed; inset: 0; z-index: 95; display: none; } .pf-sheet.open { display: block; } .pf-scrim { position: absolute; inset: 0; background: rgba(8,20,16,.5); animation: llFade .2s ease; }
    .pf-panel { position: absolute; left: 0; right: 0; bottom: 0; max-width: 560px; margin: 0 auto; background: var(--ll-surface, #fff); color: var(--ll-text); border-radius: 26px 26px 0 0; padding: 12px 18px calc(22px + env(safe-area-inset-bottom, 0px)); animation: llSheetUp .3s cubic-bezier(.2,.8,.2,1); } .pf-panel h3 { margin: 4px 0 12px; font-size: 18px; font-weight: 800; }
    .pf-v { animation: pfIn .35s cubic-bezier(.2,.8,.2,1) both; }
    @keyframes pfIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
    @media (max-width: 767px) { .pf-old { display: none !important; } }
    @media (min-width: 768px) { #app { padding-top: 20px !important; } .pf-top { border-radius: 26px 26px 0 0; } .pf-body { background: transparent; } }
    @media (prefers-reduced-motion: reduce) { .pf-v, .pf-qa button { animation: none !important; } }
  </style>

<body class="min-h-screen flex flex-col bg-slate-50 antialiased selection:bg-emerald-100 selection:text-emerald-800" data-ll-page="profile" data-ll-role="customer">
<header class="pf-old bg-white border-b border-slate-200/80 sticky top-0 z-30"><div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between gap-4">
    <a href="dashboard.html" aria-label="LifeLink home"><img src="images/lifelink-logo.png" alt="LifeLink" class="h-10 w-auto"></a>
    <div class="flex items-center gap-3"><div data-ll-bell></div></div></div></header>
<main id="app" class="flex-grow w-full mx-auto"><p class="text-sm font-semibold text-slate-500 text-center py-16">Loading profile…</p></main>

<script src="supabase-client.js"></script>
