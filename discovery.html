<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Find providers - LIFELINK</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { theme: { extend: {
  colors: { emerald: { 50:'#ecfdf5', 100:'#d1fae5', 500:'#10b981', 600:'#059669', 700:'#047857' },
            charcoal: { 50:'#f8fafc', 100:'#f1f5f9', 200:'#e2e8f0', 300:'#cbd5e1', 400:'#94a3b8', 500:'#64748b', 600:'#475569', 700:'#334155', 800:'#1e293b', 900:'#0f172a' } },
  fontFamily: { sans: ['Plus Jakarta Sans','sans-serif'] } } } }
  </script>
  <style>
    body { background-color: #F8FAFC; color: #0F172A; font-family: 'Plus Jakarta Sans', sans-serif; }
    .nav-item-active { background-color: #ECFDF5; color: #047857; font-weight: 800; }
    .field { width: 100%; background: #f8fafc; border: 1px solid #cbd5e1; border-radius: 1rem; padding: .75rem 1rem; font-size: .875rem; font-weight: 600; color: #0f172a; outline: none; }
    .field:focus { border-color: #059669; background: #fff; }
    .lbl { display: block; font-size: .75rem; font-weight: 800; color: #334155; text-transform: uppercase; letter-spacing: .05em; margin-bottom: .375rem; }
  </style>
  <script src="ll-theme-init.js"></script>
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="LifeLink">
  <link rel="stylesheet" href="ll-app.css">
</head>
<body class="min-h-screen flex flex-col bg-slate-50 antialiased selection:bg-emerald-100 selection:text-emerald-800" data-ll-page="discovery" data-ll-role="public">
<header class="bg-white border-b border-slate-200/80 sticky top-0 z-30"><div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between gap-4">
    <a href="index.html" aria-label="LifeLink home"><img src="images/lifelink-logo.png" alt="LifeLink" class="h-10 w-auto"></a>
    <nav class="hidden sm:flex items-center gap-6 text-sm font-extrabold text-slate-600"><a href="discovery.html" class="hover:text-emerald-600">Find providers</a><a href="provider-onboarding.html" class="hover:text-emerald-600">For providers</a><a href="trust-safety.html" class="hover:text-emerald-600">Trust &amp; Safety</a></nav>
    <div class="flex items-center gap-3"><div data-ll-bell></div><div data-ll-account class="flex items-center gap-2"></div></div></div></header>
  <main class="flex-grow max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-6">
    <div><h1 class="text-3xl font-extrabold text-slate-900">Find a provider</h1><p class="text-sm font-semibold text-slate-500">Every provider listed here has been verified by an administrator.</p></div>
    <div class="bg-white border border-slate-200 rounded-3xl p-4 grid sm:grid-cols-2 lg:grid-cols-5 gap-3 items-center">
      <input id="search" class="field lg:col-span-2" placeholder="Search by name, skill or service" aria-label="Search">
      <select id="cat" class="field" aria-label="Category"><option value="">All categories</option></select>
      <select id="area" class="field" aria-label="Area"><option value="">Any area</option></select>
      <select id="sort" class="field" aria-label="Sort"><option value="rating">Highest rated</option><option value="jobs">Most jobs done</option><option value="price">Lowest starting price</option></select>
      <label class="flex items-center gap-2 text-sm font-bold text-slate-600"><input id="avail" type="checkbox"> Available now</label>
      <p id="count" class="text-xs font-extrabold text-slate-400 lg:col-span-4 lg:text-right"></p>
    </div>
    <div id="results" class="grid md:grid-cols-2 xl:grid-cols-3 gap-5"></div>
    <p class="text-xs font-semibold text-slate-400">Map view is coming later.</p>
  </main>
<script src="supabase-config.js"></script>
<script src="supabase-client.js"></script>
<script src="supabase-auth.js"></script>
<script src="ll-api.js"></script>
<script src="lifelink.js"></script>
<script src="ll-chat.js"></script>
<script src="page-discovery.js"></script>
<script src="ll-app.js" defer></script>
</body>
</html>
