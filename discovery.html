<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Find providers - LIFELINK</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { theme: { extend: {
  colors: { emerald: { 50:'#ecfdf5', 100:'#d1fae5', 500:'#10b981', 600:'#059669', 700:'#047857' },
            charcoal: { 50:'#f8fafc', 100:'#f1f5f9', 200:'#e2e8f0', 300:'#cbd5e1', 400:'#94a3b8', 500:'#64748b', 600:'#475569', 700:'#334155', 800:'#1e293b', 900:'#0f172a' } },
  fontFamily: { sans: ['Plus Jakarta Sans','sans-serif'] } } } }
  </script>
  <style>
    body { background-color: #F8FAFC; color: #0F172A; font-family: 'Plus Jakarta Sans', sans-serif; }
    .nav-item-active { background-color: #ECFDF5; color: #047857; font-weight: 800; }
    .field { width: 100%; background: #f8fafc; border: 1px solid #cbd5e1; border-radius: 1rem; padding: .75rem 1rem; font-size: .875rem; font-weight: 600; color: #0f172a; outline: none; }
    .field:focus { border-color: #059669; background: #fff; }
    .lbl { display: block; font-size: .75rem; font-weight: 800; color: #334155; text-transform: uppercase; letter-spacing: .05em; margin-bottom: .375rem; }
  #sort{background:transparent;color:inherit}#sort option{background:var(--ll-surface);color:var(--ll-text)}
</style>
  <script src="ll-theme-init.js"></script>
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="LifeLink">
  <link rel="stylesheet" href="ll-app.css">
  <style>
    /* Services screen: app look on phones, same layout rules on larger screens */
    .dc-bar, .dc-sheet .dc-scrim, .dc-sheet .dc-grab { display: none; }
    .dc-search { position: relative; max-width: 640px; }
    .dc-search svg { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); width: 20px; height: 20px; color: var(--ll-text-2); pointer-events: none; }
    .dc-search input { width: 100%; height: 52px; border-radius: 16px; border: 1px solid var(--ll-border); background: var(--ll-surface); color: var(--ll-text); padding: 0 16px 0 46px; font: 600 15px "Plus Jakarta Sans", system-ui, sans-serif; outline: none; box-shadow: 0 1px 2px rgba(20,43,39,.04); }
    .dc-search input:focus { border-color: var(--ll-primary); box-shadow: 0 0 0 3px var(--ll-primary-soft); }
    .dc-chips { display: flex; gap: 10px; overflow-x: auto; margin: 0 -16px; padding: 2px 16px; scrollbar-width: none; scroll-padding: 0 16px; }
    .dc-chips::-webkit-scrollbar { display: none; }
    .dc-chip { flex: none; min-height: 42px; padding: 0 20px; border-radius: 999px; border: 1px solid var(--ll-border); background: var(--ll-surface); color: var(--ll-text); font: 700 14px "Plus Jakarta Sans", system-ui, sans-serif; cursor: pointer; transition: background .2s, color .2s, transform .15s var(--ll-ease), border-color .2s; }
    .dc-chip:active { transform: scale(.95); }
    .dc-chip[aria-selected="true"] { background: var(--ll-primary); color: #fff; border-color: var(--ll-primary); box-shadow: 0 6px 14px rgba(7,134,95,.28); }
    .dc-tools { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .dc-sort, .dc-filter { display: inline-flex; align-items: center; gap: 8px; height: 44px; padding: 0 14px; border-radius: 14px; border: 1px solid var(--ll-border); background: var(--ll-surface); color: var(--ll-text); font: 700 13.5px "Plus Jakarta Sans", system-ui, sans-serif; }
    .dc-sort svg, .dc-filter svg { width: 18px; height: 18px; color: var(--ll-text-2); flex: none; }
    .dc-sort select { border: 0; outline: 0; background: transparent; color: inherit; font: inherit; font-weight: 800; padding-right: 2px; max-width: 150px; }
    .dc-filter { cursor: pointer; } .dc-filter b { min-width: 20px; height: 20px; border-radius: 10px; background: var(--ll-primary); color: #fff; font-size: 11px; line-height: 20px; text-align: center; }
    .dc-filter b[hidden] { display: none; }
    .dc-count { margin: 0; font-size: 12.5px; font-weight: 700; color: var(--ll-text-2); }
    .dc-list { display: grid; gap: 14px; grid-template-columns: 1fr; }
    @media (min-width: 768px) { .dc-main { gap: 20px !important; } .dc-list { grid-template-columns: repeat(2, 1fr); } .dc-chips { margin: 0; padding: 2px 0; flex-wrap: wrap; } }
    @media (min-width: 1280px) { .dc-list { grid-template-columns: repeat(3, 1fr); } }
    .pc { display: flex; gap: 14px; padding: 12px; border-radius: 22px; background: var(--ll-surface); border: 1px solid var(--ll-border); box-shadow: var(--ll-shadow); animation: llRise .5s var(--ll-ease) both; transition: transform .2s var(--ll-ease), box-shadow .2s; }
    @media (hover: hover) { .pc:hover { transform: translateY(-3px); box-shadow: var(--ll-shadow-lg); } }
    .pc-ph { flex: none; width: 96px; height: 112px; border-radius: 16px; overflow: hidden; background: var(--ll-primary-soft); display: flex; align-items: center; justify-content: center; color: var(--ll-primary); font: 800 26px "Plus Jakarta Sans", system-ui, sans-serif; }
    .pc-ph img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .pc-b { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
    .pc-n { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .pc-n a { font-weight: 800; font-size: 16px; color: var(--ll-text); text-decoration: none; line-height: 1.2; }
    .pc-v { display: inline-flex; align-items: center; gap: 4px; padding: 3px 8px; border-radius: 999px; background: var(--ll-primary-soft); color: var(--ll-primary); font-size: 11px; font-weight: 800; }
    .pc-v svg { width: 12px; height: 12px; }
    .pc-r, .pc-c, .pc-p { margin: 0; font-size: 13px; font-weight: 600; color: var(--ll-text-2); display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    .pc-r .st { color: #f5a524; font-weight: 800; } .pc-r .dot { opacity: .5; }
    .pc-c { color: var(--ll-text); } .pc-c svg { width: 15px; height: 15px; color: var(--ll-text-2); flex: none; }
    .pc-p { color: var(--ll-text); font-weight: 800; font-size: 14px; }
    .pc-a { margin-left: auto; font-size: 11px; font-weight: 800; }
    .pc-btn { margin-top: auto; display: flex; align-items: center; justify-content: center; min-height: 44px; border-radius: 12px; background: var(--ll-primary); color: #fff !important; font-weight: 800; font-size: 14.5px; text-decoration: none; box-shadow: 0 8px 18px rgba(7,134,95,.26); transition: transform .15s var(--ll-ease); }
    .pc-btn:active { transform: scale(.97); }
    .pc-sk { height: 136px; border-radius: 22px; background: linear-gradient(100deg, var(--ll-surface-2) 30%, var(--ll-surface) 50%, var(--ll-surface-2) 70%); background-size: 200% 100%; animation: llShimmer 1.4s linear infinite; }

    /* filters: inline panel on desktop, bottom sheet on phones */
    .dc-panel { background: var(--ll-surface); border: 1px solid var(--ll-border); border-radius: 22px; padding: 16px; display: grid; gap: 12px; }
    .dc-panel h2 { display: none; margin: 0; font-size: 18px; font-weight: 800; }
    .dc-f span { display: block; margin: 0 0 6px; font-size: 12px; font-weight: 800; letter-spacing: .05em; text-transform: uppercase; color: var(--ll-text-2); }
    .dc-chk { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 14px; min-height: 44px; }
    .dc-chk input { width: 20px; height: 20px; accent-color: var(--ll-primary); }
    .dc-acts { display: none; gap: 10px; }
    .dc-btn1, .dc-btn2 { flex: 1; min-height: 48px; border-radius: 14px; font: 800 15px "Plus Jakarta Sans", system-ui, sans-serif; cursor: pointer; }
    .dc-btn1 { background: var(--ll-primary); color: #fff; border: 0; } .dc-btn2 { background: transparent; color: var(--ll-text); border: 1.5px solid var(--ll-border); }
    @media (min-width: 768px) { .dc-panel { grid-template-columns: repeat(3, 1fr); align-items: end; } .dc-filter { display: none; } .dc-tools { justify-content: flex-start; } }
    @media (max-width: 767.98px) {
      .dc-old, .dc-title { display: none !important; }
      .dc-bar { display: flex; align-items: center; justify-content: space-between; gap: 8px; position: sticky; top: 0; z-index: 30; padding: calc(8px + env(safe-area-inset-top, 0px)) 12px 8px; background: color-mix(in srgb, var(--ll-bg) 92%, transparent); backdrop-filter: blur(10px); }
      .dc-bar h1 { margin: 0; flex: 1; font-size: 20px; font-weight: 800; color: var(--ll-text); }
      .dc-ic { width: 44px; height: 44px; border-radius: 14px; border: 0; background: transparent; color: var(--ll-text); display: flex; align-items: center; justify-content: center; cursor: pointer; } .dc-ic svg { width: 24px; height: 24px; }
      .dc-ic:active { background: var(--ll-primary-soft); }
      .dc-foot { display: none; }
      .dc-sheet { position: fixed; inset: 0; z-index: 95; display: none; } .dc-sheet.open { display: block; }
      .dc-sheet .dc-scrim { display: block; position: absolute; inset: 0; background: rgba(8,20,16,.5); animation: llFade .2s ease; }
      .dc-panel { position: absolute; left: 0; right: 0; bottom: 0; border-radius: 26px 26px 0 0; border: 0; padding: 10px 18px calc(20px + env(safe-area-inset-bottom, 0px)); animation: llSheetUp .28s var(--ll-ease); }
      .dc-panel h2 { display: block; } .dc-sheet .dc-grab { display: block; width: 42px; height: 4px; border-radius: 4px; background: var(--ll-border); margin: 0 auto 4px; }
      .dc-acts { display: flex; }
    }
    @media (prefers-reduced-motion: reduce) { .pc, .dc-panel, .pc-sk { animation: none !important; } }
  </style>
</head>
<body class="min-h-screen flex flex-col bg-slate-50 antialiased selection:bg-emerald-100 selection:text-emerald-800" data-ll-page="discovery" data-ll-role="public">
<header class="dc-old bg-white border-b border-slate-200/80 sticky top-0 z-30"><div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between gap-4">
    <a href="index.html" aria-label="LifeLink home"><img src="images/lifelink-logo.png" alt="LifeLink" class="h-10 w-auto"></a>
    <nav class="hidden sm:flex items-center gap-6 text-sm font-extrabold text-slate-600"><a href="discovery.html" class="hover:text-emerald-600">Find providers</a><a href="provider-onboarding.html" class="hover:text-emerald-600">For providers</a><a href="trust-safety.html" class="hover:text-emerald-600">Trust &amp; Safety</a></nav>
    <div class="flex items-center gap-3"><div data-ll-bell></div><div data-ll-account class="flex items-center gap-2"></div></div></div></header>
  
  <!-- app bar (phones) -->
  <div class="dc-bar">
    <button type="button" class="dc-ic" id="dcBack" aria-label="Back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
    <h1>Services</h1>
    <button type="button" class="dc-ic" id="dcFind" aria-label="Search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg></button>
  </div>
  <main class="dc-main flex-grow max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-4 md:py-8" style="display:flex;flex-direction:column;gap:14px">
    <div class="dc-title"><h1 class="text-3xl font-extrabold text-slate-900">Find a provider</h1><p class="text-sm font-semibold text-slate-500">Every provider listed here has been verified by an administrator.</p></div>

    <div class="dc-search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      <input id="search" type="search" enterkeyhint="search" placeholder="Search services..." aria-label="Search by name, skill or service" autocomplete="off">
    </div>

    <div class="dc-chips" id="chips" role="tablist" aria-label="Categories"></div>

    <div class="dc-tools">
      <label class="dc-sort"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M7 12h10M10 17h4"/></svg><span>Sort:</span>
        <select id="sort" aria-label="Sort"><option value="rating">Highest rated</option><option value="jobs">Most jobs done</option><option value="price">Lowest starting price</option></select></label>
      <button type="button" class="dc-filter" id="filtersBtn" aria-haspopup="dialog"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 5h18l-7 8v6l-4 2v-8z"/></svg>Filters<b id="fCount" hidden></b></button>
    </div>

    <p id="count" class="dc-count"></p>
    <div id="results" class="dc-list" aria-live="polite"></div>
    <p class="text-xs font-semibold text-slate-400 dc-foot">Map view is coming later.</p>
  </main>
  <div class="dc-sheet" id="fsheet" role="dialog" aria-label="Filters">
      <div class="dc-scrim" id="fscrim"></div>
      <div class="dc-panel">
        <div class="dc-grab"></div>
        <h2>Filters</h2>
        <label class="dc-f"><span>Category</span><select id="cat" class="field" aria-label="Category"><option value="">All categories</option></select></label>
        <label class="dc-f"><span>Area</span><select id="area" class="field" aria-label="Area"><option value="">Any area</option></select></label>
        <label class="dc-chk"><input id="avail" type="checkbox"> Available now</label>
        <div class="dc-acts"><button type="button" id="fReset" class="dc-btn2">Reset</button><button type="button" id="fDone" class="dc-btn1">Show results</button></div>
      </div>
    </div>

<script src="supabase-config.js"></script>
<script src="supabase-client.js"></script>
<script src="supabase-auth.js"></script>
<script src="ll-api.js"></script>
<script src="lifelink.js"></script>
<script src="ll-chat.js"></script>
<script src="page-discovery.js"></script>
<script src="ll-app.js" defer></script>
</body>
</html>
